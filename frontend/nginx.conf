# ExperimentOS SPA + API reverse proxy.
# Installed as /etc/nginx/templates/default.conf.template; the nginx image's entrypoint
# runs envsubst on it at start-up (only variables defined in the environment are replaced,
# so nginx runtime variables such as $host are left intact).
#   API_UPSTREAM  scheme://host:port of the Django API (default http://api:8000)

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";
    proxy_read_timeout 120s;

    # REST API (includes /api/v1/..., /api/schema/, /api/docs/)
    location /api/ {
        proxy_pass ${API_UPSTREAM};
    }

    # Prometheus scrape endpoint and probes served by Django
    location = /metrics {
        proxy_pass ${API_UPSTREAM};
    }
    location = /healthz {
        proxy_pass ${API_UPSTREAM};
    }
    location = /readyz {
        proxy_pass ${API_UPSTREAM};
    }

    # Fingerprinted build assets: cache forever
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA history fallback; never cache the shell
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }
}
