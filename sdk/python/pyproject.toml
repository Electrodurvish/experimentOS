[project]
name = "experimentos-sdk"
version = "0.1.0"
description = "Python SDK for ExperimentOS experiment evaluation and event tracking"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["experimentos_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:django"
