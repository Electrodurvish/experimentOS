global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "experimentos-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: "event-consumer"
    static_configs:
      - targets: ["event-consumer:9100"]

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
