# Production overrides. ArgoCD renders the chart with values.yaml + this file
# (deploy/argocd/application-prod.yaml).
#
# The image tags below are rewritten by CI (.github/workflows/cd.yml, job
# "promote") to the git SHA of the commit on main that produced the images.
# Do not edit them by hand unless you are rolling back.

image:
  api:
    repository: ghcr.io/electrodurvish/experimentos-api
    tag: "f343d1ebf6d67033ea2c5ccb6ab9b2cab062e239"
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/electrodurvish/experimentos-frontend
    tag: "f343d1ebf6d67033ea2c5ccb6ab9b2cab062e239"
    pullPolicy: IfNotPresent
# Created out-of-band (External Secrets Operator syncing from AWS Secrets
# Manager is the intended setup - see deploy/terraform/README.md). Keys:
# SECRET_KEY, DATABASE_URL, REDIS_URL, CELERY_BROKER_URL, SENTRY_DSN,
# ALERT_WEBHOOK_URL, ANTHROPIC_API_KEY.
existingSecret: experimentos-secrets
config:
  DJANGO_SETTINGS_MODULE: config.settings.production
  ALLOWED_HOSTS: "experimentos.example.com"
  CSRF_TRUSTED_ORIGINS: "https://experimentos.example.com"
  CORS_ALLOWED_ORIGINS: "https://experimentos.example.com"
  LOG_LEVEL: INFO
  SECURE_SSL_REDIRECT: "True"
  DB_CONN_MAX_AGE: "60"
  # Managed / external services - fill in from `terraform output`.
  CASSANDRA_CONTACT_POINTS: "scylla-client.scylla.svc.cluster.local"
  CASSANDRA_PORT: "9042"
  CASSANDRA_KEYSPACE: experimentos
  CASSANDRA_STICKY_ENABLED: "True"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-bootstrap.kafka.svc.cluster.local:9092"
  KAFKA_ENABLED: "True"
  CLICKHOUSE_HOST: "clickhouse.clickhouse.svc.cluster.local"
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_DATABASE: experimentos
  OTEL_ENABLED: "True"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4317"
  SENTRY_ENVIRONMENT: production
  SENTRY_TRACES_SAMPLE_RATE: "0.05"
  DECISION_INTERVAL_SECONDS: "300"
  HEALTH_INTERVAL_SECONDS: "900"
api:
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 65
  pdb:
    enabled: true
    minAvailable: 2
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 1Gi
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: experimentos
          app.kubernetes.io/component: api
eventConsumer:
  autoscaling:
    enabled: true
    minReplicas: 2
    # Must not exceed the partition count of the event topics.
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
celeryWorker:
  replicaCount: 2
  concurrency: 4
frontend:
  replicaCount: 2
ingress:
  enabled: true
  className: nginx
  host: experimentos.example.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
  tls:
    - secretName: experimentos-tls
      hosts:
        - experimentos.example.com
migrations:
  enabled: true
setupJob:
  enabled: false
serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack
