apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "experimentos.configMapName" . }}
  labels:
    {{- include "experimentos.labels" . | nindent 4 }}
data:
  {{- include "experimentos.configData" . | trim | nindent 2 }}
{{- if .Values.migrations.enabled }}
---
# Copy of the ConfigMap for the pre-install/pre-upgrade migration hook
# (hooks run before regular resources are created on first install).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "experimentos.hookConfigMapName" . }}
  labels:
    {{- include "experimentos.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  {{- include "experimentos.configData" . | trim | nindent 2 }}
{{- end }}
