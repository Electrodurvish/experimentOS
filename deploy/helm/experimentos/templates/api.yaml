{{- if .Values.api.enabled }}
{{- $c := .Values.api }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "experimentos.fullname" . }}-api
  labels:
    {{- include "experimentos.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  {{- if not $c.autoscaling.enabled }}
  replicas: {{ $c.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "experimentos.selectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "experimentos.selectorLabels" (dict "ctx" . "component" "api") | nindent 8 }}
      annotations:
        {{- include "experimentos.configChecksums" . | nindent 8 }}
        {{- with $c.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "experimentos.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Give gunicorn time to finish in-flight requests after the endpoint is removed.
      terminationGracePeriodSeconds: 40
      containers:
        - name: api
          image: {{ include "experimentos.apiImage" . }}
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          command: ["gunicorn", "config.wsgi:application"]
          args:
            - --bind=0.0.0.0:8000
            - --workers={{ $c.gunicorn.workers }}
            - --threads={{ $c.gunicorn.threads }}
            - --worker-class=gthread
            - --timeout={{ $c.gunicorn.timeout }}
            - --graceful-timeout=30
            - --worker-tmp-dir=/tmp
            - --access-logfile=-
            - --error-logfile=-
            {{- range $arg := splitList " " $c.gunicorn.extraArgs }}
            {{- if $arg }}
            - {{ $arg | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            {{- include "experimentos.envFrom" . | nindent 12 }}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Probes and Prometheus scrapes arrive with Host: <podIP>:8000.
            - name: ALLOWED_HOSTS
              value: "$(POD_IP),{{ $c.probeHost }},{{ .Values.config.ALLOWED_HOSTS }}"
            - name: OTEL_SERVICE_NAME
              value: experimentos-api
            # Aggregate Prometheus metrics across gunicorn workers (see gunicorn.conf.py).
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /tmp/prometheus
            {{- with $c.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $c.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml $c.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml $c.readinessProbe | nindent 12 }}
          lifecycle:
            preStop:
              # Let the endpoints controller/ingress drop the pod before SIGTERM.
              exec:
                command: ["sleep", "5"]
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            {{- include "experimentos.tmpVolumeMount" . | nindent 12 }}
      volumes:
        {{- include "experimentos.tmpVolume" . | nindent 8 }}
      {{- with $c.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "experimentos.scheduling" $c | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "experimentos.fullname" . }}-api
  labels:
    {{- include "experimentos.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  type: {{ $c.service.type }}
  selector:
    {{- include "experimentos.selectorLabels" (dict "ctx" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ $c.service.port }}
      targetPort: http
      protocol: TCP
{{- if $c.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "experimentos.fullname" . }}-api
  labels:
    {{- include "experimentos.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "experimentos.fullname" . }}-api
  minReplicas: {{ $c.autoscaling.minReplicas }}
  maxReplicas: {{ $c.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $c.autoscaling.targetCPUUtilizationPercentage }}
    {{- with $c.autoscaling.customMetrics }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $c.autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if $c.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "experimentos.fullname" . }}-api
  labels:
    {{- include "experimentos.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  minAvailable: {{ $c.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "experimentos.selectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
{{- end }}
{{- end }}
