{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "experimentos.serviceAccountName" . }}
  labels:
    {{- include "experimentos.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The workloads never talk to the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
