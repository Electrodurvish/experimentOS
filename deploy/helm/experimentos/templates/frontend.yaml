{{- if .Values.frontend.enabled }}
{{- $c := .Values.frontend }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "experimentos.fullname" . }}-frontend
  labels:
    {{- include "experimentos.componentLabels" (dict "ctx" . "component" "frontend") | nindent 4 }}
spec:
  replicas: {{ $c.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "experimentos.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "experimentos.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 8 }}
      {{- with $c.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "experimentos.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ include "experimentos.frontendImage" . }}
          imagePullPolicy: {{ .Values.image.frontend.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $c.containerPort }}
              protocol: TCP
          env:
            # nginx proxies /api to this upstream (in-cluster api Service).
            - name: API_UPSTREAM
              value: "http://{{ include "experimentos.fullname" . }}-api:{{ .Values.api.service.port }}"
          livenessProbe:
            {{- toYaml $c.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml $c.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          {{- with $c.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- include "experimentos.scheduling" $c | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "experimentos.fullname" . }}-frontend
  labels:
    {{- include "experimentos.componentLabels" (dict "ctx" . "component" "frontend") | nindent 4 }}
spec:
  type: {{ $c.service.type }}
  selector:
    {{- include "experimentos.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: {{ $c.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
