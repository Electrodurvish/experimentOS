{{- if not .Values.existingSecret }}
{{- if not .Values.secrets }}
{{- fail "Set either .Values.existingSecret or .Values.secrets (SECRET_KEY, DATABASE_URL, REDIS_URL, CELERY_BROKER_URL)." }}
{{- end }}
{{- range $required := list "SECRET_KEY" "DATABASE_URL" }}
{{- if not (index $.Values.secrets $required) }}
{{- fail (printf "secrets.%s is required when existingSecret is not set" $required) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "experimentos.secretName" . }}
  labels:
    {{- include "experimentos.labels" . | nindent 4 }}
type: Opaque
data:
  {{- include "experimentos.secretData" . | trim | nindent 2 }}
{{- if .Values.migrations.enabled }}
---
# Hook-scoped copy for the migration Job (see _helpers.tpl: hookSecretName).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "experimentos.hookSecretName" . }}
  labels:
    {{- include "experimentos.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
data:
  {{- include "experimentos.secretData" . | trim | nindent 2 }}
{{- end }}
{{- end }}
