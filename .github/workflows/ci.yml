# CI: lint -> unit tests -> integration smoke (Postgres + Redis) + frontend
#     -> build images -> Trivy scan -> push to GHCR (main only).
# CD (image tag promotion into Helm values for ArgoCD) lives in cd.yml and runs
# after this workflow succeeds on main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PRs/branches, never on main (every main commit
  # should produce images).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "1.8.3"
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # ruff is a standalone binary; no need to resolve the whole dependency tree.
      - name: Install ruff (version range from pyproject dev group)
        run: pip install "ruff>=0.6,<0.7"
      - name: ruff check
        run: ruff check --output-format=github .

  test:
    name: Unit tests (pytest, sqlite, mocked services)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: pip install "poetry==${POETRY_VERSION}" && poetry config virtualenvs.in-project true
      # poetry.lock is gitignored, so dependencies are resolved from pyproject.toml
      # ranges on a cache miss. The cache key includes the week number so the
      # resolved set is refreshed regularly instead of pinning forever.
      - name: Compute cache week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/pypoetry
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('pyproject.toml') }}-${{ steps.week.outputs.week }}
      - name: Install dependencies
        run: poetry install --no-interaction --no-root --with dev
      - name: pytest with coverage
        run: poetry run pytest --cov=apps --cov=config --cov-report=term-missing:skip-covered --cov-report=xml -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  integration:
    name: Integration (Postgres + Redis)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    # NOTE: config.settings.test hard-codes in-memory sqlite, so the pytest suite
    # cannot run against Postgres without a backend change. This job instead
    # verifies the parts that genuinely depend on Postgres/Redis: migrations
    # apply cleanly on Postgres, no model changes are missing migrations, the
    # production settings boot under gunicorn, and a seeded experiment can be
    # evaluated end-to-end (API key auth -> Postgres -> Redis cache).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: experimentos
          POSTGRES_USER: experimentos
          POSTGRES_PASSWORD: experimentos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U experimentos"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      SECRET_KEY: ci-integration-secret
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://experimentos:experimentos@localhost:5432/experimentos
      REDIS_URL: redis://localhost:6379/0
      # Not provisioned in this job; the app degrades gracefully without them.
      KAFKA_ENABLED: "False"
      CASSANDRA_STICKY_ENABLED: "False"
      CLICKHOUSE_HOST: ""
      OTEL_ENABLED: "False"
      CELERY_BROKER_URL: memory://
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: pip install "poetry==${POETRY_VERSION}" && poetry config virtualenvs.in-project true
      - name: Compute cache week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/pypoetry
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('pyproject.toml') }}-${{ steps.week.outputs.week }}
      - name: Install dependencies
        run: poetry install --no-interaction --no-root --with dev
      - name: No missing migrations
        run: poetry run python manage.py makemigrations --check --dry-run
      - name: Migrations apply on PostgreSQL
        run: poetry run python manage.py migrate --noinput
      - name: Migration plan is fully applied
        run: poetry run python manage.py migrate --check
      - name: Django system checks (production settings, deploy checklist)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
        run: poetry run python manage.py check --deploy --fail-level ERROR
      - name: Boot gunicorn with production settings
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          SECURE_SSL_REDIRECT: "False"
        run: |
          poetry run python manage.py collectstatic --noinput -v 0
          poetry run gunicorn config.wsgi:application --bind 127.0.0.1:8000 --workers 1 --threads 4 \
            --daemon --pid /tmp/gunicorn.pid --error-logfile /tmp/gunicorn.log
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/readyz
      - name: End-to-end smoke (seed via REST API, evaluate, track)
        run: |
          poetry run python loadtest/seed.py --base-url http://127.0.0.1:8000 --out /tmp/seed.json
          API_KEY=$(python -c "import json;print(json.load(open('/tmp/seed.json'))['api_key'])")
          EXP=$(python -c "import json;print(json.load(open('/tmp/seed.json'))['experiment_keys'][0])")
          for _ in 1 2; do  # second call should be served from the Redis cache
            curl -fsS -X POST http://127.0.0.1:8000/api/v1/evaluate/ \
              -H "X-API-Key: $API_KEY" -H "Content-Type: application/json" \
              -d "{\"user_id\":\"ci-user-1\",\"experiment_keys\":[\"$EXP\"]}" | tee /tmp/eval.json
            echo
          done
          python -c "import json,sys; e=json.load(open('/tmp/eval.json'))['evaluations']; sys.exit(0 if all(v['assigned'] for v in e.values()) else 1)"
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/events/track/ \
            -H "X-API-Key: $API_KEY" -H "Content-Type: application/json" \
            -d '{"user_id":"ci-user-1","event_name":"purchase","value":9.99}'
          # The evaluate call must have populated the Redis config cache.
          poetry run python -c "import redis,sys; r=redis.Redis.from_url('redis://localhost:6379/0'); sys.exit(0 if list(r.scan_iter('exp:config:*')) else 1)"
          curl -fsS http://127.0.0.1:8000/metrics | grep -E '^experiment_cache_hits_total' || true
      - name: gunicorn log
        if: always()
        run: cat /tmp/gunicorn.log || true

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test --if-present -- --run
        env:
          CI: "true"
      - run: npm run build

  images:
    name: Image ${{ matrix.image.name }} (build, scan, push)
    runs-on: ubuntu-latest
    needs: [test, integration, frontend]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: api
            context: .
            dockerfile: Dockerfile
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/experimentos-${{ matrix.image.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build (load into local docker for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          load: true
          push: false
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
      - name: Trivy scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
      - name: Trivy report (HIGH, informational)
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          format: table
          severity: HIGH
          ignore-unfixed: true
          exit-code: "0"
          skip-setup-trivy: true
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "${{ steps.meta.outputs.image }}:${{ github.sha }}"
          docker push "${{ steps.meta.outputs.image }}:latest"

  helm:
    name: Helm chart (lint + render + schema)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: |
          helm lint deploy/helm/experimentos -f deploy/helm/experimentos/values-dev.yaml
          helm lint deploy/helm/experimentos -f deploy/helm/experimentos/values-prod.yaml
      - name: Render and validate against Kubernetes schemas
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          for env in dev prod; do
            helm template experimentos deploy/helm/experimentos -f deploy/helm/experimentos/values-$env.yaml > /tmp/$env.yaml
            ./kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.30.0 /tmp/$env.yaml
          done
